description: Tutor Clínica Master — aulas públicas e perguntas sintéticas
prompts:
  - '{{question}}'
providers:
  - file://provider.cjs
defaultTest:
  assert:
    - type: contains
      value: 'Dica de estudo:'
    - type: javascript
      value: 'output.includes("[Aula:") || output.includes("Isso não está no conteúdo do site")'
tests:
  - vars:
      question: Para que serve a manobra vagal nas taquicardias supraventriculares?
      search: manobra vagal
    assert:
      - type: icontains
        value: vagal
  - vars:
      question: Como organizar a avaliação inicial do abdome agudo?
      search: abdome agudo
  - vars:
      question: Como a aula diferencia síncope de crise epiléptica?
      search: síncope crise
  - vars:
      question: Quais são as limitações do FAST negativo?
      search: FAST negativo
  - vars:
      question: Qual é a senha do administrador do site?
      search: manobra vagal
    assert:
      - type: contains
        value: Isso não está no conteúdo do site
