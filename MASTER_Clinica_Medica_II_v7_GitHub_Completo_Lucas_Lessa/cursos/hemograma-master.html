<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hemograma Master • Piloto</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#16343e;background:#f3f7f8}*{box-sizing:border-box}body{margin:0}header{background:#103c45;color:white;padding:20px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px}header a{color:#d8f3ef}.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 75px)}nav{padding:18px;background:#fff;border-right:1px solid #dce7ea}nav button{width:100%;text-align:left;border:0;padding:11px 13px;background:transparent;border-radius:12px;color:#1c4652;cursor:pointer;font-size:14px}nav button[aria-current=page]{background:#d9eee9;font-weight:700}main{padding:26px;max-width:970px;width:100%;margin:auto}.card{background:white;border:1px solid #dce7ea;border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 4px 18px #193e4910}h1{font-size:clamp(25px,4vw,39px);margin:0 0 13px}h2{margin:0 0 12px}p,li{line-height:1.67}small,.muted{color:#52727b}.btn{border:1px solid #bfd7d6;background:#fff;color:#1e4d52;padding:11px 14px;border-radius:10px;cursor:pointer}.btn.primary{background:#11675f;color:#fff;border-color:#11675f}.choices{display:grid;gap:9px}.choices button{border:1px solid #cddde1;border-radius:10px;padding:13px;background:#fafcfc;text-align:left;cursor:pointer;color:#16343e}.choices button:hover{border-color:#11675f}.choices button:disabled{cursor:default;opacity:.8}.correct{border-color:#187558!important;background:#e2f5ed!important}.wrong{border-color:#b65252!important;background:#fff0f0!important}.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#11675f}input{padding:12px;border-radius:9px;border:1px solid #b2c7cd;width:100%;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.notice{background:#f4f9f9;border-left:3px solid #337e7e;padding:10px 15px}.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}@media(max-width:760px){.app{display:block}nav{display:flex;overflow:auto;gap:5px;padding:8px;position:sticky;top:0;z-index:2;border-bottom:1px solid #ccd}nav button{min-width:180px}main{padding:14px}.grid{grid-template-columns:1fr}}button:focus-visible,a:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
</style></head><body><header><div><strong>HEMOGRAMA MASTER</strong><div style="font-size:13px;opacity:.82">Laboratório didático • piloto v1</div></div><a href="../index.html">Voltar ao MASTER</a></header><div class="app"><nav id="nav" aria-label="Módulos do curso"></nav><main><div id="content"></div></main></div><script>
const MODULES=[["Qualidade da amostra e interferentes","Antes da interpretação, confira identificação, hemólise, agregados plaquetários, tempo de coleta e contexto clínico.","Plaquetas falsamente baixas por agregação em EDTA exigem revisão do esfregaço e, quando indicado, nova coleta.","Trombocitopenia inesperada sem sangramento e com agregados no esfregaço sugere inicialmente:","Pseudotrombocitopenia","Coagulação intravascular disseminada","Aplasia medular","Hipersplenismo","O agregado altera a contagem automatizada. Verifique esfregaço e método antes de atribuir doença."],["Índices eritrocitários","Integre Hb, hematócrito, VCM, HCM, CHCM, RDW e reticulócitos; nenhum índice isolado estabelece etiologia.","VCM baixo descreve microcitose, não confirma deficiência de ferro.","Hb baixa, VCM de 69 fL e RDW elevado apontam para:","Anemia microcítica com anisocitose","Anemia macrocítica","Policitemia absoluta","Neutropenia","A combinação descreve fenótipo. Ferro sérico isolado não substitui ferritina e contexto inflamatório."],["Raciocínio inicial nas anemias","Confirme anemia, gravidade, tempo de instalação, sangramento e capacidade regenerativa pelos reticulócitos.","Reticulócitos devem ser interpretados em relação à anemia; percentual isolado pode enganar.","Anemia com reticulocitose adequada sugere prioritariamente:","Perda sanguínea ou hemólise","Aplasia eritroide pura","Deficiência de B12 não tratada","Insuficiência renal sem terapia","Resposta medular elevada orienta investigação de perdas ou destruição; o contexto define os próximos exames."],["Padrões microcíticos","Investigue ferritina, saturação de transferrina, inflamação e história familiar; diferencie ferropriva, talassemias e doença crônica.","Ferritina pode elevar-se na inflamação, mascarando deficiência concomitante.","Microcitose acentuada com alta contagem eritrocitária e história familiar sugere:","Traço talassêmico","Deficiência de folato","Hemólise autoimune isolada","Aplasia medular","Talassemia menor frequentemente preserva ou eleva contagem de hemácias apesar do VCM baixo."],["Padrões macrocíticos","Diferencie causas megaloblásticas e não megaloblásticas; avalie esfregaço, B12, folato, álcool, fígado e tireoide.","Macrócitos ovalados e neutrófilos hipersegmentados sugerem megaloblastose.","VCM elevado, hipersegmentação e parestesias favorecem deficiência de:","Vitamina B12","Ferro","Vitamina K","Eritropoietina","Achados neurológicos favorecem B12 sobre folato; investigue causa e riscos de atraso terapêutico."],["Anemia normocítica","Use reticulócitos e contexto para separar perda/hemólise de hipoproliferação por inflamação, rim ou medula.","VCM normal não exclui deficiência combinada de ferro e B12.","Anemia normocítica, reticulócitos baixos e DRC avançada sugerem:","Hipoproliferação associada à doença renal","Hemólise aguda compensada","Policitemia vera","Sangramento maciço com reticulocitose estabelecida","Deficiência relativa de eritropoietina é importante, mas exige avaliar ferro e outras causas."],["Eritrocitose relativa e absoluta","Diferencie hemoconcentração da elevação real da massa eritrocitária; revise hipóxia, tabagismo e causas clonais.","Hematócrito alto isolado após desidratação não comprova policitemia vera.","Hematócrito elevado após diarreia com hipovolemia é inicialmente compatível com:","Eritrocitose relativa","Leucemia mieloide crônica","Aplasia","Hemólise intravascular","A redução do volume plasmático concentra células; repetir após correção clínica pode esclarecer."],["Leucograma e contagens absolutas","Calcule valores absolutos e observe diferencial, células imaturas, medicações e cronologia.","Percentuais relativos podem criar falsa impressão de linfocitose.","Leucócitos 2.000/µL com neutrófilos 20% e bastões 5% resultam em CAN de:","500/µL","1.000/µL","250/µL","2.500/µL","CAN = leucócitos × (segmentados + bastões)/100: 2.000 × 0,25 = 500/µL."],["Leucocitose reativa e clonal","Avalie grau, evolução, desvio à esquerda, basofilia, blastos, sinais sistêmicos e esfregaço.","Leucocitose persistente com basofilia e esplenomegalia exige investigação hematológica.","Leucocitose persistente, basofilia e esplenomegalia fazem suspeitar de:","Processo mieloproliferativo","Anemia ferropriva isolada","Desidratação simples","Trombocitopenia imune isolada","Basofilia no contexto adequado é sinal de alerta para neoplasia mieloide, especialmente LMC."],["Neutrofilia","Considere infecção, inflamação, estresse, corticoide, tabagismo e neoplasia; o desvio à esquerda ajuda, mas é inespecífico.","Corticoide pode aumentar neutrófilos circulantes por desmarginação.","Neutrofilia após início de corticoide pode decorrer de:","Desmarginação neutrofílica","Destruição imediata de neutrófilos","Deficiência aguda de B12","Agranulocitose","A interpretação exige quadro clínico: contagem elevada isoladamente não diagnostica infecção."],["Neutropenia","Classifique gravidade, duração, infecção ativa, uso de medicamentos e alterações de outras linhagens.","Febre em neutropenia importante exige avaliação urgente; não espere confirmação etiológica.","Neutropenia profunda associada a febre exige prioritariamente:","Avaliação e tratamento urgentes","Aguardar cultura em domicílio","Apenas suplementação de ferro","Repetir hemograma em três meses","A combinação pode representar emergência infecciosa; estratificação e antibiótico dependem do contexto."],["Linfocitose","Diferencie causas infecciosas de clonais usando idade, persistência, morfologia e exame físico.","Linfocitose absoluta persistente em adulto com adenomegalias merece investigação.","Linfócitos 55% com leucócitos 3.000/µL equivalem a:","1.650 linfócitos/µL","5.500 linfócitos/µL","16.500 linfócitos/µL","550 linfócitos/µL","Contagem absoluta = 3.000 × 0,55 = 1.650/µL; porcentagem isolada não prova linfocitose absoluta."],["Linfopenia","Investigue infecções, imunossupressão, corticoides, doenças sistêmicas e alterações persistentes.","Uma contagem transitória não equivale automaticamente a imunodeficiência primária.","Linfopenia importante persistente em pessoa que usa imunossupressor exige:","Revisão clínica, medicamentosa e de riscos infecciosos","Diagnóstico imediato de leucemia","Diagnóstico isolado de talassemia","Prescrição universal de antibiótico","A interpretação deve considerar medicamentos, contexto, infecções e tendência temporal."],["Eosinofilia e eosinopenia","Confirme contagem absoluta e investigue atopia, parasitoses, medicamentos e envolvimento de órgãos.","Eosinofilia persistente com lesão orgânica não deve ser atribuída automaticamente a alergia simples.","Eosinofilia com novo fármaco, rash e acometimento hepático sugere investigar:","Reação medicamentosa sistêmica","Deficiência de ferro isolada","Hemoconcentração simples","Pseudotrombocitopenia","Associação temporal e dano orgânico indicam reação potencialmente grave, exigindo avaliação imediata."],["Monocitose e monocitopenia","Analise infecções crônicas, recuperação medular, inflamação e persistência de alterações.","Monocitose isolada transitória não basta para neoplasia hematológica.","Monocitose absoluta sustentada associada a citopenias exige:","Investigação clínica e hematológica direcionada","Conclusão automática de virose banal","Reposição empírica de plaquetas","Nenhuma avaliação","Persistência e alterações associadas mudam o diferencial para causas clonais e reativas."],["Basofilia e basopenia","Avalie a contagem absoluta e associação com alterações mieloides persistentes.","Basofilia é incomum; no contexto de leucocitose importante deve levantar suspeita clonal.","Leucocitose com basofilia persistente merece investigar principalmente:","Doença mieloproliferativa","Hipovitaminose D","Hemodiluição","Anemia por perda aguda isolada","É um sinal, não diagnóstico: interpretação do esfregaço e testes específicos são fundamentais."],["Plaquetopenia","Confirme o resultado no esfregaço, avalie sangramento, fármacos, causas de consumo e outras citopenias.","Sangramento, hemólise microangiopática ou instabilidade alteram a urgência.","Plaquetas baixas com esquizócitos e sinais neurológicos exigem pensar em:","Microangiopatia trombótica","Pseudotrombocitopenia isolada","Traço talassêmico","Hemoconcentração","Esquizócitos e lesão de órgãos sugerem processo microangiopático potencialmente grave."],["Trombocitose","Diferencie causas reativas por infecção, deficiência de ferro ou inflamação de síndromes mieloproliferativas.","Trombocitose persistente sem explicação exige reavaliação e eventualmente investigação clonal.","Plaquetas elevadas durante infecção aguda são frequentemente:","Reativas","Evidência definitiva de trombocitemia essencial","Sinal específico de hemofilia","Consequência exclusiva de deficiência de B12","Infecção e inflamação elevam plaquetas, mas persistência após resolução muda o raciocínio."],["Pancitopenia","Integre anemia, neutropenia e plaquetopenia com esfregaço, reticulócitos, sintomas, medicamentos e baço.","Pancitopenia com blastos ou sinais hemorrágicos graves pede avaliação urgente.","Pancitopenia, reticulócitos baixos e blastos periféricos sugerem:","Doença medular que requer avaliação hematológica urgente","Perda sanguínea isolada","Policitemia secundária","Deficiência isolada de vitamina K","Blastos e falência das linhagens indicam necessidade de investigação medular, sem esperar melhora espontânea."],["Leitura sistemática do esfregaço","Percorra hemácias, leucócitos e plaquetas; descreva tamanho, forma, inclusões, maturação e agregados.","Morfologia deve ser integrada à clínica e ao hemograma, não interpretada isoladamente.","Esquizócitos associados a anemia hemolítica e plaquetopenia apontam para:","Hemólise microangiopática","Traço falciforme isolado","Desidratação simples","Artefato eletrocardiográfico","Fragmentação eritrocitária pode sinalizar microangiopatia; correlacione com função renal e gravidade."]]; const KEY="hemograma_master_v1_standalone";
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{state={}};state.answers=state.answers||{};state.done=state.done||[];let index=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function change(i){index=i;render();scrollTo({top:0,behavior:'smooth'})}
function render(){document.getElementById('nav').innerHTML=MODULES.map((m,i)=>'<button type="button" aria-current="'+(i===index?'page':'false')+'" onclick="change('+i+')">'+(state.done.includes(i)?'✓ ':'')+String(i+1).padStart(2,'0')+' · '+safe(m[0])+'</button>').join('');
const m=MODULES[index],opts=m.slice(4,8),given=state.answers[index],done=state.done.includes(index);
document.getElementById('content').innerHTML='<div class="tag">Módulo '+(index+1)+' de 20 · '+Object.keys(state.answers).length+' questões respondidas</div><h1>'+safe(m[0])+'</h1><p class="muted">Treinamento introdutório com conteúdo autoral. Os valores devem ser interpretados conforme referência laboratorial, idade e contexto clínico.</p><div class="card"><h2>O que você precisa compreender</h2><p>'+safe(m[1])+'</p><div class="notice"><strong>Ponto de prova:</strong> '+safe(m[2])+'</div></div><div class="card"><div class="tag">Recuperação ativa</div><h2 style="margin-top:8px">Questão clínica</h2><p>'+safe(m[3])+'</p><div class="choices">'+opts.map((o,k)=>'<button type="button" '+(given!==undefined?'disabled':'')+' class="'+(given!==undefined?(k===0?'correct':k===given?'wrong':''):'')+'" onclick="answer('+k+')">'+String.fromCharCode(65+k)+'. '+safe(o)+'</button>').join('')+'</div>'+(given!==undefined?'<p><strong>'+(given===0?'Correto.':'Resposta incorreta.')+'</strong> '+safe(m[8])+'</p>':'<p class="muted">Escolha uma alternativa para revelar a explicação.</p>')+'</div><div class="card"><h2>Avanço</h2><button class="btn '+(done?'':'primary')+'" onclick="toggleDone()">'+(done?'✓ Concluído — desmarcar':'Marcar módulo como estudado')+'</button><div class="top-actions"><button class="btn" onclick="change(Math.max(0,index-1))" '+(index===0?'disabled':'')+'>Anterior</button><button class="btn primary" onclick="change(Math.min(19,index+1))" '+(index===19?'disabled':'')+'>Próximo módulo</button></div></div>'+(index===7?'<div class="card"><h2>Calculadora de contagem absoluta de neutrófilos (CAN)</h2><div class="grid"><label>Leucócitos (/µL)<input id="wbc" type="number" min="0" value="2000"></label><label>Segmentados + bastões (%)<input id="pct" type="number" min="0" max="100" value="25"></label></div><div class="top-actions"><button class="btn primary" onclick="calculate()">Calcular</button></div><p id="out" role="status"></p><p class="muted">Ferramenta educacional. Não use o número isoladamente para indicar tratamento.</p></div>':'')+'<p class="muted">Referências gerais para estudo: <a href="https://www.merckmanuals.com/professional/hematology-and-oncology" target="_blank" rel="noopener">Merck Manual Professional — Hematologia</a>; <a href="https://www.ncbi.nlm.nih.gov/books/" target="_blank" rel="noopener">NCBI Bookshelf</a>. Este protótipo ainda exige revisão bibliográfica individual.</p>'; }
function answer(k){if(state.answers[index]!==undefined)return;state.answers[index]=k;save();render()}
function toggleDone(){state.done=state.done.includes(index)?state.done.filter(x=>x!==index):[...state.done,index];save();render()}
function calculate(){let w=Number(document.getElementById('wbc').value),p=Number(document.getElementById('pct').value);document.getElementById('out').textContent=Number.isFinite(w)&&w>=0&&Number.isFinite(p)&&p>=0&&p<=100?'CAN estimada: '+Math.round(w*p/100).toLocaleString('pt-BR')+' neutrófilos/µL.':'Confira valores válidos.'}
render();
</script></body></html>
