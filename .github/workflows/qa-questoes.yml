name: QA rápida — controles de questões
on:
  pull_request:
    paths:
      - 'MASTER_Clinica_Medica_II_v7_GitHub_Completo_Lucas_Lessa/qnav.*'
      - 'MASTER_Clinica_Medica_II_v7_GitHub_Completo_Lucas_Lessa/app.js'
      - 'MASTER_Clinica_Medica_II_v7_GitHub_Completo_Lucas_Lessa/p1_app.js'
      - 'MASTER_Clinica_Medica_II_v7_GitHub_Completo_Lucas_Lessa/cir_app.js'
      - 'MASTER_Clinica_Medica_II_v7_GitHub_Completo_Lucas_Lessa/index.html'
      - 'tests/qnav.test.cjs'
      - 'tests/account-ui.test.cjs'
      - '.github/workflows/qa-questoes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: mkdir -p work/ux-multiplataforma && node --test tests/qnav.test.cjs tests/account-ui.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: botoes-questoes-celular
          path: work/ux-multiplataforma/*-filtro-390.png
          if-no-files-found: ignore
