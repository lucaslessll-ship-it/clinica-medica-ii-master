name: QA alinhamento responsivo (Clínica Master)
on:
  pull_request:
    paths:
      - 'MASTER_Clinica_Medica_II_v7_GitHub_Completo_Lucas_Lessa/layout-guard.css'
      - 'MASTER_Clinica_Medica_II_v7_GitHub_Completo_Lucas_Lessa/index.html'
      - 'MASTER_Clinica_Medica_II_v7_GitHub_Completo_Lucas_Lessa/master-planner.css'
      - 'MASTER_Clinica_Medica_II_v7_GitHub_Completo_Lucas_Lessa/section-rail.css'
      - 'tests/layout-guard*.test.cjs'
      - '.github/workflows/qa-layout-alinhamento.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Chrome iPad, celular, Split View e desktop
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testar padrões de layout
        run: node --test tests/layout-guard.test.cjs
      - name: Testar 6 telas reais no navegador
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node --test tests/layout-guard-browser.test.cjs
      - name: Verificar pré-teste e leitura ampliada no iPad (fluxo real)
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node --test tests/leitura-ipad.test.cjs
