name: Publicar MASTER no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar ferramentas e gerar site otimizado
        run: npm ci && npm run build

      - name: Verificar site otimizado e acessibilidade
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node --test tests/optimized-site.test.cjs

      - name: Validar os arquivos do site
        shell: bash
        run: |
          set -euo pipefail
          app_dir=MASTER_Clinica_Medica_II_v7_GitHub_Completo_Lucas_Lessa
          python3 "$app_dir/scripts/validar.py"
          python3 "$app_dir/scripts/validar_v7.py"
          for file in "$app_dir"/*.js; do node --check "$file"; done
          node --check "$app_dir/laboratorio-master/microcitose/app.js"
          node --check "$app_dir/laboratorio-master/microcitose/sync.js"
          node scripts/validar-correlacoes.cjs
          node --test tests/lab-master-integration.test.cjs

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Empacotar somente o site
        shell: bash
        run: |
          set -euo pipefail
          site_dir="$RUNNER_TEMP/master-site"
          mkdir -p "$site_dir"
          cp -R dist/. "$site_dir/"

      - name: Enviar o pacote do site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/master-site

      - name: Aguardar indexação do artefato do GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" = "1" ]; then
              echo "Artefato github-pages identificado. Aguardando consistência da API."
              sleep 6
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "Há mais de um artefato github-pages nesta execução; iniciar uma execução nova."
              exit 1
            fi
            sleep 4
          done
          echo "Artefato github-pages não ficou disponível na API."
          exit 1

      - name: Aguardar publicação automática dos arquivos originais
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=30" --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment" and .status != "completed")] | length')
            if [ "$pending" = "0" ]; then exit 0; fi
            sleep 5
          done
          echo "A publicação automática ainda está em andamento; evitando publicações concorrentes."
          exit 1

      - name: Publicar o site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
